<html lang="en">
<head>

<title>Diego Hernández Suárez — Project Universe</title>

<style>
  html, body {
    margin: 0;
    background: #020611;
    color: #eef5ff;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    width: min(1500px, 98vw);
    padding: 24px 0 14px;
  }
  h1 {
    text-align: center;
    font-size: 34px;
    margin: 8px 0 10px;
  }
  p {
    text-align: center;
    color: #bfd0ea;
    margin: 0 20px 18px;
    line-height: 1.5;
  }
  .links {
    text-align: center;
    margin-bottom: 18px;
    color: #cbd8ee;
  }
  .links a {
    color: #dbe7ff;
    text-decoration: none;
    margin: 0 10px;
  }
  .links a:hover {
    text-decoration: underline;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .clickable {
    cursor: pointer;
    transition: filter .15s ease;
  }
  a:hover .clickable {
    filter: brightness(1.18);
  }
  .note {
    text-align: center;
    color: #8399bb;
    font-size: 13px;
    letter-spacing: .03em;
    margin: 14px;
  }
</style>
</head>
